# Remoto de CondoHub: modulo ES que el shell importa desde otro origen (por eso CORS abierto en lectura)
server {
    listen 80;
    root /usr/share/nginx/html;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-cache" always;   # remoteEntry.js no lleva hash: el navegador debe revalidarlo tras cada despliegue
    location / { try_files $uri =404; }
}